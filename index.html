<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inventario Bar</title>
<meta name="description" content="Inventario del bar: categorie, prodotti, cartoni, pezzi e bottiglie con avviso di scorta minima.">
<meta name="theme-color" content="#162126">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Inventario">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;600;700&display=swap">
<link rel="stylesheet" href="app.css?v=9">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand"><h1 id="appTitle">Inventario <span>Bar</span></h1></div>
    <div class="top-actions">
      <button id="installBtn" class="btn primary" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        <span class="lbl" data-i18n="installShort">Installa</span>
      </button>
      <button id="undoBtn" class="btn icon" type="button" data-i18n-aria="undo" aria-label="Annulla" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
      </button>
      <button id="exportBtn" class="btn icon" type="button" data-i18n-aria="exportBtn" aria-label="Esporta">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 11v6M9.5 14.5 12 17l2.5-2.5"/></svg>
      </button>
      <button id="refreshBtn" class="btn refresh" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
        <span class="lbl" id="refreshLabel">Aggiorna</span><span class="cnt num" id="refreshCnt" hidden></span>
      </button>
    </div>
  </div>
  <div class="tools" id="invTools">
    <input id="search" class="search" type="search" autocomplete="off" data-i18n-ph="search" placeholder="Cerca prodotto…">
    <button id="lowFilter" class="chip" type="button" aria-pressed="false"><span data-i18n="lowOnly">Sotto scorta</span> <b id="lowCount" class="num">0</b></button>
    <button id="histBtn" class="btn icon" type="button" data-i18n-aria="histBtn" aria-label="Storico e consumi">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
    </button>
  </div>
</header>

<main>
  <section id="view-inv"></section>
  <section id="view-order" hidden></section>
  <section id="view-list" hidden></section>
  <section id="view-cats" hidden></section>
  <section id="view-set" hidden></section>
  <section id="view-hist" hidden></section>
</main>

<button id="fab" class="fab" type="button">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  <span data-i18n="addShort">Prodotto</span>
</button>

<nav class="tabs" aria-label="Menu">
  <button type="button" data-tab="inv" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2h6v4l2 3v12a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V9l2-3z"/><path d="M7 13h10"/></svg>
    <span data-i18n="tabInv">Inventario</span>
  </button>
  <button type="button" data-tab="order">
    <span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.3"/><circle cx="18" cy="20" r="1.3"/></svg><b id="orderBadge" class="tbadge num" hidden>0</b></span>
    <span data-i18n="tabOrder">Ordine</span>
  </button>
  <button type="button" data-tab="list">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1 1 2-2M3.5 12l1 1 2-2"/><circle cx="5" cy="18" r="1"/></svg>
    <span id="listTabLabel" class="tlbl">Lista</span>
  </button>
  <button type="button" data-tab="cats">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
    <span data-i18n="tabCats">Categorie</span>
  </button>
  <button type="button" data-tab="set">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    <span data-i18n="tabSet">Impostazioni</span>
  </button>
</nav>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-back" data-close></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" id="sheetPanel"></div>
</div>
<div id="toast" class="toast" role="status" hidden></div>
<input id="importFile" type="file" accept="application/json,.json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="app.js?v=9"></script>
</body>
</html>
